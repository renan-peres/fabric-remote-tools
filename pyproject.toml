[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric_remote_tools"
version = "0.1.4"
description = "Tools for working with Microsoft Fabric remotely"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Renan Peres", email = "renan.peres@example.com"}
]
keywords = ["fabric", "azure", "data", "tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "deltalake>=0.18.0",
    "connectorx>=0.3.0",
    "pyodbc>=5.0.0",
    "pymssql>=2.2.0",
    "duckdb>=1.0.0",
    "requests>=2.31.0",
    "pytz>=2024.1",
    "azure-identity>=1.15.0",
    "azure-devops>=7.1.0b1",
    "azure-storage-file-datalake>=12.13.0",
]

[project.urls]
Homepage = "https://github.com/renan-peres/fabric-remote-tools"
Repository = "https://github.com/renan-peres/fabric-remote-tools"
Documentation = "https://github.com/renan-peres/fabric-remote-tools/blob/main/README.md"

[tool.setuptools]
packages = ["fabric_remote_tools"]
